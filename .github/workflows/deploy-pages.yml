name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Configure Vite base path
        shell: bash
        run: |
          repo_name="${GITHUB_REPOSITORY#*/}"
          if [[ "$repo_name" == "${GITHUB_REPOSITORY_OWNER}.github.io" ]]; then
            echo "VITE_BASE_PATH=/" >> "$GITHUB_ENV"
          else
            echo "VITE_BASE_PATH=/${repo_name}/" >> "$GITHUB_ENV"
          fi
      - run: npm ci
      # The synchronized Veggie Deer collection is intentionally enriched in
      # batches.  Its all-recipes release gate is a final-publishing check,
      # not a prerequisite for deploying a valid partial site update.
      - name: Validate deployable site
        run: |
          npm run recipes:curate:test
          npm run recipes:overrides:validate
          npm run recipes:translations:validate
          npm run lint:data
          npm run recipes:release-gate
          npm run images:prompts:check
          npm run images:check
          npm run build
      - name: Verify deploy artifact
        run: |
          test -f dist/index.html
          test -f dist/404.html
          test -n "$(find dist/assets -name 'recipes.runtime-*.json' -print -quit)"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
